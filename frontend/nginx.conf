worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org; font-src 'self' data: https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            # The API independently enforces permanently read-only container mode.
            limit_except GET OPTIONS { deny all; }
            error_page 403 = @read_only;
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $closureops_backend backend:8001;
            proxy_pass http://$closureops_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:8001";
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location @read_only {
            default_type application/json;
            return 403 '{"error":{"code":"CONTAINER_READ_ONLY","message":"Manager writes and AI inference are disabled in this container demo."}}';
        }

        location /assets/ {
            try_files $uri =404;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
